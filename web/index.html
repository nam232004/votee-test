<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Votee Wordle Solver</title>
    <style>
      :root {
        --correct: #6aaa64;
        --present: #c9b458;
        --absent: #787c7e;
        --line: #d3d6da;
      }
      body {
        font: 16px/1.5 system-ui, sans-serif;
        max-width: 640px;
        margin: 40px auto;
        padding: 0 20px;
        color: #1a1a1b;
      }
      h1 {
        font-size: 20px;
        letter-spacing: 0.02em;
      }
      hr {
        border: 0;
        border-top: 1px solid var(--line);
        margin: 24px 0;
      }
      label {
        display: block;
        font-size: 13px;
        color: #555;
        margin-bottom: 4px;
      }
      .row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: flex-end;
      }
      .row > div {
        flex: 1 1 120px;
      }
      select,
      input,
      button {
        font: inherit;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 4px;
        width: 100%;
        box-sizing: border-box;
        background: #fff;
      }
      button {
        background: #1a1a1b;
        color: #fff;
        border-color: #1a1a1b;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .tiles {
        display: flex;
        gap: 4px;
      }
      .tile {
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        color: #fff;
        font-weight: 700;
        text-transform: uppercase;
        border-radius: 3px;
      }
      .correct {
        background: var(--correct);
      }
      .present {
        background: var(--present);
      }
      .absent {
        background: var(--absent);
      }
      .step {
        display: flex;
        gap: 16px;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px solid #eee;
      }
      .meta {
        font-size: 13px;
        color: #555;
      }
      .status {
        font-weight: 600;
        margin-top: 16px;
      }
      .error {
        color: #b00020;
      }
      code {
        background: #f4f4f5;
        padding: 1px 5px;
        border-radius: 3px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <h1>Votee Wordle Solver</h1>
    <p class="meta">
      Giao diện gọi vào cùng một solver với CLI. Mọi lượt đoán đều đi tới API thật tại
      <code>wordle.votee.dev</code>.
    </p>

    <hr />

    <div class="row">
      <div>
        <label for="mode">Puzzle</label>
        <select id="mode">
          <option value="random">/random — server chọn từ</option>
          <option value="daily">/daily — puzzle hôm nay</option>
          <option value="word">/word — tôi tự đặt đáp án</option>
        </select>
      </div>
      <div>
        <label for="strategy">Thuật toán</label>
        <select id="strategy">
          <option value="entropy">entropy (99,0%)</option>
          <option value="minimax">minimax (99,7%)</option>
          <option value="freq">freq (90,7%)</option>
        </select>
      </div>
    </div>

    <div class="row" style="margin-top: 12px">
      <div>
        <label for="seed">Seed <span class="meta">(bỏ trống = tự sinh)</span></label>
        <input id="seed" type="number" min="0" placeholder="ví dụ 1 → fiery" />
      </div>
      <div>
        <label for="target">Đáp án <span class="meta">(chỉ cho /word)</span></label>
        <input id="target" placeholder="ví dụ apple" />
      </div>
      <div style="flex: 0 0 120px">
        <button id="solve">Giải</button>
      </div>
    </div>

    <hr />

    <div id="steps"></div>
    <p id="status" class="status"></p>

    <script type="module">
      // Server tự phục vụ file này, nên để trống là gọi cùng origin. Nếu mở bằng Live
      // Server thì đổi thành 'http://localhost:3000'.
      const API = location.port === '3000' ? '' : 'http://localhost:3000';

      const el = (id) => document.getElementById(id);
      const steps = el('steps');
      const status = el('status');

      const tiles = (guess, feedback) =>
        feedback.map((mark, i) => `<div class="tile ${mark}">${guess[i]}</div>`).join('');

      function renderStep(step) {
        const node = document.createElement('div');
        node.className = 'step';
        node.innerHTML = `
          <div class="tiles">${tiles(step.guess, step.feedback)}</div>
          <div class="meta">#${step.attempt} · còn ${step.remaining.toLocaleString('en-US')} từ khả thi</div>`;
        steps.append(node);
      }

      async function run() {
        const button = el('solve');
        button.disabled = true;
        steps.replaceChildren();
        status.className = 'status';
        status.textContent = 'Đang gọi API…';

        const params = new URLSearchParams({ mode: el('mode').value, strategy: el('strategy').value });
        if (el('seed').value) params.set('seed', el('seed').value);
        if (el('target').value) params.set('target', el('target').value.trim());

        try {
          const response = await fetch(`${API}/api/solve?${params}`);
          const data = await response.json();
          if (!response.ok) throw new Error(data.error);

          // Hiện dần từng lượt để thấy được quá trình thu hẹp.
          for (const step of data.history) {
            renderStep(step);
            await new Promise((resolve) => setTimeout(resolve, 350));
          }

          const seed = data.seed ? ` · seed ${data.seed}` : '';
          status.textContent = data.solved
            ? `Giải được "${data.answer}" trong ${data.attempts} lượt${seed}`
            : `Không giải được trong ${data.attempts} lượt${seed}`;
        } catch (error) {
          status.className = 'status error';
          status.textContent = `Lỗi: ${error.message}`;
        } finally {
          button.disabled = false;
        }
      }

      el('solve').addEventListener('click', run);
      el('mode').addEventListener('change', () => {
        el('seed').disabled = el('mode').value !== 'random';
        el('target').disabled = el('mode').value !== 'word';
      });
      el('mode').dispatchEvent(new Event('change'));
    </script>
  </body>
</html>
